name: release

# Publishing a tag does three things: pushes the image the launcher pulls,
# builds the Debian package, and republishes the APT repository that serves it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shipwright

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' agent/__init__.py)" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          docker build -f docker/agent.Dockerfile -t "$IMAGE:${{ steps.version.outputs.version }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:latest"

  package:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build the package
        run: sh scripts/build_deb.sh dist
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" dist/*.deb --clobber
      - name: Take the published repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - name: Start one if there is none
        run: mkdir -p site
      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "E: secret APT_GPG_PRIVATE_KEY is not set; apt refuses an unsigned repository" >&2
            exit 1
          fi
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          echo "SHIPWRIGHT_GPG_KEY_ID=$key" >> "$GITHUB_ENV"
      - name: Rebuild the repository
        run: sh scripts/build_apt_repo.sh site dist/*.deb
      - name: Publish it
        working-directory: site
        run: |
          # The repository is regenerated each release, so it carries no history.
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "shipwright release"
          git config user.email "oluwatoyosi.abolaji25@gmail.com"
          git add -A
          git commit -q -m "apt repository for ${{ inputs.tag || github.ref_name }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
